---
# secrets doc - https://kubernetes.io/docs/concepts/configuration/secret/
apiversion: v1
kind: Secret
metadata:
  name: mysecret
type: Opaque  # Opaque is the default type for secrets, which means the data is stored as key-value pairs without any specific structure.
# The data field contains the actual secret values, which are base64 encoded. In this example, we have two secrets: db-password and rabbitmq-password.
data:
  db-password: dnByb2RicGFzcw== # base64 encoded value of 'vprodbpass'
  rabbitmq-password: Z3Vlc3Q= # base64 encoded value of 'guest'