---
- name: Print facts
  hosts: all
  #gather_facts: False
  # the below tasks will excute only if gather_facts is True (default), because they are using built-in fact variables
  # all the ansible_ prefixed variables are gathered facts
  tasks:
    - name: Print OS name
      debug:
        var: ansible_distribution 
    - name: Print selinux mode
      debug:
        var: ansible_selinux.mode
    - name: Print RAM memory
      debug:
        var: ansible_memory_mb.real.free

    - name: Print Processor name
      debug:
        var: ansible_processor[2]

    - name: Print python version
      debug:
        var: ansible_python.version.full
